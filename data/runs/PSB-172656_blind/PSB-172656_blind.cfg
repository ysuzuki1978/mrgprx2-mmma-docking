# ====================================================================
# PSB-172656 Blind Docking (ab initio, no restraints)
# Purpose: Explore full receptor surface to identify binding site(s)
#          without any prior knowledge bias
# Hypothesis: If PSB-172656 is an allosteric antagonist (TM2/TM7),
#             blind docking should reveal clusters away from the
#             orthosteric site (TM4-6)

# directory in which the scoring will be done
run_dir = "/home/yakuri/haddock3_transfer/work/runs_full/ligand_small/PSB-172656_blind/run1"

# execution mode
mode = "local"
ncores = 16

# molecules to be docked
molecules = [
    "/home/yakuri/haddock3_transfer/MRGPRX2_chainA.pdb",
    "/home/yakuri/haddock3_transfer/PSB-172656_chainB.pdb"
    ]

# ====================================================================
# Parameters for each stage are defined below
# ====================================================================
[topoaa]
autohis = true
ligand_param_fname = "/home/yakuri/haddock3_transfer/work/params/PSB-172656_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/haddock3_transfer/work/params/PSB-172656_chainB-acpype.top"
delenph = false

[rigidbody]
# Center-of-mass restraints to keep molecules in contact (essential for blind docking)
cmrest = true
tolerance = 5
ligand_param_fname = "/home/yakuri/haddock3_transfer/work/params/PSB-172656_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/haddock3_transfer/work/params/PSB-172656_chainB-acpype.top"
# 10x sampling for thorough surface exploration
sampling = 10000
w_vdw = 1.0

[caprieval]

[seletop]
# Select top 400 from 10000 to capture diverse binding sites
select = 400

[caprieval]

[flexref]
tolerance = 5
ligand_param_fname = "/home/yakuri/haddock3_transfer/work/params/PSB-172656_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/haddock3_transfer/work/params/PSB-172656_chainB-acpype.top"
mdsteps_rigid = 0
mdsteps_cool1 = 0

[caprieval]

[emref]
tolerance = 5
ligand_param_fname = "/home/yakuri/haddock3_transfer/work/params/PSB-172656_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/haddock3_transfer/work/params/PSB-172656_chainB-acpype.top"

[caprieval]

# FCC-based clustering: groups by interface contacts (ideal for finding distinct binding sites)
[clustfcc]
min_population = 4

[seletopclusts]
top_models = 4

[caprieval]

[caprieval]
allatoms = true

# ====================================================================
