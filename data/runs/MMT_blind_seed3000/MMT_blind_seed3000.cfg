# ====================================================================
# MMA (methyl methacrylate) Blind Docking - ab initio, no AIR restraints
# Purpose: unbiased test of whether the SP1 (E164/D184) pocket is
#          recovered without being told where to look.
#          This is the actual confirmation of the AutoDock pose.
# Charge: 0 (neutral)
# Protocol: identical to Ondansetron_blind.cfg
# ====================================================================

run_dir = "/home/yakuri/haddock3_transfer/work/runs_full/ligand_small/MMT_blind_seed3000/run1"

mode = "local"
ncores = 16

molecules = [
    "/home/yakuri/haddock3_transfer/MRGPRX2_chainA.pdb",
    "/home/yakuri/haddock3_transfer/MMT_chainB.pdb"
    ]

# ====================================================================
[topoaa]
autohis = true
ligand_param_fname = "/home/yakuri/haddock3_transfer/work/params/MMT_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/haddock3_transfer/work/params/MMT_chainB-acpype.top"
delenph = false

[rigidbody]
iniseed = 3000
# Center-of-mass restraints only (essential for blind docking)
cmrest = true
tolerance = 5
ligand_param_fname = "/home/yakuri/haddock3_transfer/work/params/MMT_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/haddock3_transfer/work/params/MMT_chainB-acpype.top"
sampling = 10000
w_vdw = 1.0

[caprieval]

[seletop]
select = 400

[caprieval]

[flexref]
tolerance = 5
ligand_param_fname = "/home/yakuri/haddock3_transfer/work/params/MMT_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/haddock3_transfer/work/params/MMT_chainB-acpype.top"
mdsteps_rigid = 0
mdsteps_cool1 = 0

[caprieval]

[emref]
tolerance = 5
ligand_param_fname = "/home/yakuri/haddock3_transfer/work/params/MMT_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/haddock3_transfer/work/params/MMT_chainB-acpype.top"

[caprieval]

[clustfcc]
min_population = 4

[seletopclusts]
top_models = 4

[caprieval]

[caprieval]
allatoms = true

# ====================================================================
