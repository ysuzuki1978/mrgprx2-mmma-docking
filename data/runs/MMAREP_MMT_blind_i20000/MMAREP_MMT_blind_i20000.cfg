# MMA + WT. Replication of the MMA letter on the NIG supercomputer.
# iniseed 20000 -> CNS seeds 20001..30000 (disjoint across r1..r5).
# ncores unified at 16 (the letter mixed 16 and 6 across runs).
# Pre-registered: letter_MMA/PREREG_replication.md (before running).
# ====================================================================
# MMA (methyl methacrylate) Blind Docking - ab initio, no AIR restraints
# Purpose: unbiased test of whether the SP1 (E164/D184) pocket is
#          recovered without being told where to look.
#          This is the actual confirmation of the AutoDock pose.
# Charge: 0 (neutral)
# Protocol: identical to Ondansetron_blind.cfg
# ====================================================================

run_dir = "/home/yasu1978/haddock3_nig/runs/MMAREP_MMT_blind_i20000/run1"

mode = "local"
ncores = 16

molecules = [
    "/home/yasu1978/haddock3_nig/inputs/MRGPRX2_chainA.pdb",
    "/home/yasu1978/haddock3_nig/mma_inputs/MMT_chainB.pdb"
    ]

# ====================================================================
[topoaa]
autohis = true
ligand_param_fname = "/home/yasu1978/haddock3_nig/mma_inputs/params/MMT_chainB-acpype.param"
ligand_top_fname = "/home/yasu1978/haddock3_nig/mma_inputs/params/MMT_chainB-acpype.top"
delenph = false

[rigidbody]
iniseed = 20000
# Center-of-mass restraints only (essential for blind docking)
cmrest = true
tolerance = 5
ligand_param_fname = "/home/yasu1978/haddock3_nig/mma_inputs/params/MMT_chainB-acpype.param"
ligand_top_fname = "/home/yasu1978/haddock3_nig/mma_inputs/params/MMT_chainB-acpype.top"
sampling = 10000
w_vdw = 1.0

[caprieval]

[seletop]
select = 400

[caprieval]

[flexref]
tolerance = 5
ligand_param_fname = "/home/yasu1978/haddock3_nig/mma_inputs/params/MMT_chainB-acpype.param"
ligand_top_fname = "/home/yasu1978/haddock3_nig/mma_inputs/params/MMT_chainB-acpype.top"
mdsteps_rigid = 0
mdsteps_cool1 = 0

[caprieval]

[emref]
tolerance = 5
ligand_param_fname = "/home/yasu1978/haddock3_nig/mma_inputs/params/MMT_chainB-acpype.param"
ligand_top_fname = "/home/yasu1978/haddock3_nig/mma_inputs/params/MMT_chainB-acpype.top"

[caprieval]

[clustfcc]
min_population = 4

[seletopclusts]
top_models = 4

[caprieval]

[caprieval]
allatoms = true

# ====================================================================
