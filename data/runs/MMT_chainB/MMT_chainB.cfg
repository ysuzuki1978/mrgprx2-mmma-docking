# ====================================================================
# Protein-ligand docking: MRGPRX2 + Methyl methacrylate (MMA monomer)
# Bone cement (PMMA) residual monomer
# Residue code: MMT (NOT "MMA" - collides with alpha-methyl mannoside
#               in HADDOCK3 carbohydrate.top)
# Charge: 0 (neutral ester, no ionizable group at pH 7.4)
# Protocol: identical to Ondansetron_chainB.cfg for cross-ligand comparability
# ====================================================================

# directory in which the scoring will be done
run_dir = "/home/yakuri/haddock3_transfer/work/runs_full/ligand_small/MMT_chainB/run1"

# execution mode
mode = "local"
ncores = 16

# molecules to be docked
molecules = [
    "/home/yakuri/haddock3_transfer/MRGPRX2_chainA.pdb",
    "/home/yakuri/haddock3_transfer/MMT_chainB.pdb"
    ]

# ====================================================================
# Parameters for each stage are defined below
# ====================================================================
[topoaa]
autohis = true
ligand_param_fname = "/home/yakuri/haddock3_transfer/work/params/MMT_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/haddock3_transfer/work/params/MMT_chainB-acpype.top"
delenph = false

[rigidbody]
tolerance = 5
ambig_fname = "/home/yakuri/haddock3_transfer/work/restraints/ligand_small/MMT_chainB_ambig-active-rigidbody.tbl"
ligand_param_fname = "/home/yakuri/haddock3_transfer/work/params/MMT_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/haddock3_transfer/work/params/MMT_chainB-acpype.top"
sampling = 1000
w_vdw = 1.0

[caprieval]

[seletop]
select = 200

[caprieval]

[flexref]
tolerance = 5
ambig_fname = "/home/yakuri/haddock3_transfer/work/restraints/ligand_small/MMT_chainB_ambig-passive.tbl"
ligand_param_fname = "/home/yakuri/haddock3_transfer/work/params/MMT_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/haddock3_transfer/work/params/MMT_chainB-acpype.top"
mdsteps_rigid = 0
mdsteps_cool1 = 0

[caprieval]

[rmsdmatrix]
resdic_A = [164, 170, 184, 243]
resdic_B = [1]

[clustrmsd]
criterion = "maxclust"
n_clusters = 4

[seletopclusts]
top_models = 4

[caprieval]

# Running final caprieval with allatoms parameter set to true
[caprieval]
allatoms = true

# ====================================================================
