# B 群: compound 48/80 の正しい共有結合三量体（PDB chem comp 6IB、7VV6 の結合配座）。
# A 群（Y3FRAG = レター現行、37 原子 2 分子）と同じ配座・同じプロトコル。
# 変える変数はメチレン橋 1 本と炭素 1 個だけ。
# Pre-registered: letter_MMA/PREREG_TRIMER.md section 9。iniseed 80000。
# 従来の 2 分子モデル (二量体 + 単量体)
# yakuri3 (Intel i7-13700F) で実行。NIG の EPYC とは CPU が異なるため、
# 三量体と 2 分子モデルを**同じ機械で**走らせて内部比較する。
# Pre-registered: letter_MMA/PREREG_TRIMER.md (2026-10-06)。iniseed 917。
# compound 48/80 + WT. Replication of the MMA letter on the NIG supercomputer.
# iniseed 917 (default) -> CNS seeds 918..10917 (disjoint across r1..r5).
# ncores unified at 16 (the letter mixed 16 and 6 across runs).
# Pre-registered: letter_MMA/PREREG_replication.md (before running).
# NOTE: this configuration file is named C4880_blind.cfg in the original working
# directory; the run directory it writes to is Compound4880_blind.
# ====================================================================
# Compound4880 Blind Docking (ab initio, no restraints)
# Purpose: Positive control - verify blind docking recovers known
#          orthosteric binding site (TM4-6, D184 salt bridge)
# Expected: Top cluster at orthosteric pocket with D184 contact
# Charge: +3 (3 N-methylamines protonated at pH 7.4)
# ====================================================================

# directory in which the scoring will be done
run_dir = "/home/yakuri/trimer_check/runs/Y3B_i80000/run1"

# execution mode
mode = "local"
ncores = 12

# molecules to be docked
molecules = [
    "/home/yakuri/trimer_check/inputs/MRGPRX2_chainA.pdb",
    "/home/yakuri/trimer_check/inputs/C4880_trimerB_chainB.pdb"
    ]

# ====================================================================
# Parameters for each stage are defined below
# ====================================================================
[topoaa]
autohis = true
ligand_param_fname = "/home/yakuri/trimer_check/params/B_6IB_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/trimer_check/params/B_6IB_chainB-acpype.top"
delenph = false

[rigidbody]
iniseed = 80000
# Center-of-mass restraints to keep molecules in contact (essential for blind docking)
cmrest = true
tolerance = 5
ligand_param_fname = "/home/yakuri/trimer_check/params/B_6IB_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/trimer_check/params/B_6IB_chainB-acpype.top"
# 10x sampling for thorough surface exploration
sampling = 10000
w_vdw = 1.0

[caprieval]

[seletop]
# Select top 400 from 10000 to capture diverse binding sites
select = 400

[caprieval]

[flexref]
tolerance = 5
ligand_param_fname = "/home/yakuri/trimer_check/params/B_6IB_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/trimer_check/params/B_6IB_chainB-acpype.top"
mdsteps_rigid = 0
mdsteps_cool1 = 0

[caprieval]

[emref]
tolerance = 5
ligand_param_fname = "/home/yakuri/trimer_check/params/B_6IB_chainB-acpype.param"
ligand_top_fname = "/home/yakuri/trimer_check/params/B_6IB_chainB-acpype.top"

[caprieval]

# FCC-based clustering: groups by interface contacts (ideal for finding distinct binding sites)
[clustfcc]
min_population = 4

[seletopclusts]
top_models = 4

[caprieval]

[caprieval]
allatoms = true

# ====================================================================
